# PLACEHOLDER ONLY. Not applied or pull-verified. The local OCI digest is unpushed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bau-mock
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: bau-mock}
  template:
    metadata:
      labels: {app: bau-mock}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bau
          image: example.invalid/bau-support-agent@sha256:REPLACE_PUBLISHED_MANIFEST_DIGEST
          env:
            - {name: BAU_CONFIG, value: /etc/bau/runtime.json}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "1", memory: 512Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: records, mountPath: /var/lib/bau/records}
            - {name: config, mountPath: /etc/bau, readOnly: true}
            - {name: temporary, mountPath: /tmp}
      volumes:
        # Must be pre-provisioned UID1000/mode0700, verified for actual lock/flush.
        # fsGroup/ReadWriteOnce by themselves do not prove that contract.
        - name: records
          persistentVolumeClaim: {claimName: REPLACE_PRIVATE_ENCRYPTED_RECORD_PVC}
        - name: config
          configMap: {name: bau-mock-config}
        - name: temporary
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: bau-mock-config}
data:
  runtime.json: '{"schemaVersion":1,"profile":"mock","recordsDirectory":"/var/lib/bau/records"}'
---
# Reference blueprint only; not mounted/consumed by the Mock and not proof of G3.
apiVersion: v1
kind: Secret
metadata: {name: REPLACE_CONTROLLED_REAL_ROUTE_REFERENCES}
type: Opaque
stringData:
  record-key-ref: REPLACE_CONTROLLED_ENCRYPTION_KEY_REFERENCE
  readonly-source-identity-ref: REPLACE_APPROVED_READONLY_IDENTITY_REFERENCE
  source-snapshot-volume-ref: REPLACE_IMMUTABLE_READONLY_SNAPSHOT_REFERENCE
  model-egress-policy-ref: REPLACE_APPROVED_MODEL_NETWORK_REFERENCE
  approval-ref: REPLACE_OPERATOR_RESOURCE_AUDIENCE_EXPIRY_APPROVAL
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: bau-mock-deny-network}
spec:
  podSelector:
    matchLabels: {app: bau-mock}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
